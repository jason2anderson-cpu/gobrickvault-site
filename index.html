<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Brick Vault · Robertsdale, AL</title>
<meta name="description" content="The Brick Vault, 22035 Hwy 59, Robertsdale, AL 36567. Open Tuesday to Sunday, 10am to 6pm. Call 251-256-6775.">
<meta property="og:title" content="The Brick Vault">
<meta property="og:description" content="22035 Hwy 59, Robertsdale, AL · Tue–Sun 10am–6pm · 251-256-6775">
<meta property="og:image" content="https://gobrickvault.com/logo.jpg">
<meta property="og:url" content="https://gobrickvault.com/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #000;
    --card: #141414;
    --line: #2a2a2a;
    --gold: #f6c213;
    --gold-dark: #c99a00;
    --text: #f2f2f2;
    --muted: #a8a8a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 460px; }
  .logo { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto 8px; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--gold);
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
  }
  .label {
    font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 8px;
  }
  .address { font-size: 20px; margin: 0; }
  .address a { color: var(--text); text-decoration: none; }
  table { width: 100%; border-collapse: collapse; font-size: 18px; }
  td { padding: 6px 0; }
  td:last-child { text-align: right; }
  tr.closed td { color: var(--muted); }
  tr.today td { color: var(--gold); font-weight: 700; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px; border-radius: 12px; font-size: 18px; font-weight: 700;
    text-decoration: none; text-align: center;
  }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-gold:active { background: var(--gold-dark); }
  .btn-outline { border: 2px solid var(--gold); color: var(--gold); }
  .phone { font-size: 22px; font-weight: 700; margin: 0; }
  .phone a { color: var(--text); text-decoration: none; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
  svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.jpg" width="855" height="900" alt="The Brick Vault logo: a vault door opening onto shelves of colorful building bricks">
  <h1>The Brick Vault</h1>

  <div class="buttons">
    <a class="btn btn-gold" href="tel:+12512566775">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      Call
    </a>
    <a class="btn btn-outline" href="https://www.google.com/maps/search/?api=1&amp;query=The+Brick+Vault+22035+Hwy+59+Robertsdale+AL+36567" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      Directions
    </a>
  </div>

  <section class="card">
    <p class="label">Visit us</p>
    <p class="address">
      <a href="https://www.google.com/maps/search/?api=1&amp;query=The+Brick+Vault+22035+Hwy+59+Robertsdale+AL+36567" target="_blank" rel="noopener">
        22035 Hwy 59<br>Robertsdale, AL 36567
      </a>
    </p>
  </section>

  <section class="card">
    <p class="label">Hours of operation</p>
    <table id="hours">
      <tr data-day="2"><td>Tuesday</td><td>10am – 6pm</td></tr>
      <tr data-day="3"><td>Wednesday</td><td>10am – 6pm</td></tr>
      <tr data-day="4"><td>Thursday</td><td>10am – 6pm</td></tr>
      <tr data-day="5"><td>Friday</td><td>10am – 6pm</td></tr>
      <tr data-day="6"><td>Saturday</td><td>10am – 6pm</td></tr>
      <tr data-day="0"><td>Sunday</td><td>10am – 6pm</td></tr>
      <tr data-day="1" class="closed"><td>Monday</td><td>Closed</td></tr>
    </table>
  </section>

  <section class="card">
    <p class="label">Call us</p>
    <p class="phone"><a href="tel:+12512566775">251-256-6775</a></p>
  </section>
</main>
<footer>The Brick Vault · Robertsdale, Alabama</footer>
<script>
  // Highlight today's row, using the store's own time zone (Central).
  try {
    var day = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Chicago" })).getDay();
    var row = document.querySelector('#hours tr[data-day="' + day + '"]');
    if (row) row.classList.add("today");
  } catch (e) {}
</script>
</body>
</html>
